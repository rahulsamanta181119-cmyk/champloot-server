<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PriceLoot - Best Price Compare</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f1f3f6}
.header{background:#2874f0;color:white;padding:14px 12px;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;text-align:center}
.header p{text-align:center;font-size:12px;opacity:.9;margin-top:2px}
.search-box{background:white;margin:12px;border-radius:8px;display:flex;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.search-box input{flex:1;border:none;outline:none;padding:13px;font-size:15px}
.search-box button{background:#ff9f00;color:white;border:none;padding:0 18px;font-weight:bold;font-size:15px;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;border:1px solid #ddd;background:white;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.cats button.active{background:#2874f0;color:white;border-color:#2874f0}
.count{padding:0 12px 8px;font-size:13px;color:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 20px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;flex-direction:column}
.card img{width:100%;height:170px;object-fit:cover;background:#eee}
.card-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-body h3{font-size:13px;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat-tag{font-size:11px;color:#2874f0;background:#e8f0fe;display:inline-block;padding:2px 8px;border-radius:10px;width:fit-content}
.best{font-size:12px;color:#388e3c;font-weight:bold}
.best b{font-size:18px}
.store{border-top:1px dashed #ddd;padding:6px 0 0;display:flex;flex-direction:column;gap:5px}
.store-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.store-row span{color:#555}
.store-row b{font-size:13px}
.off{color:#388e3c;font-weight:bold;font-size:11px}
.buy{background:#ff9f00;color:white;text-decoration:none;text-align:center;padding:8px;border-radius:6px;font-weight:bold;font-size:13px;margin-top:4px;display:block}
.buy.amazon{background:#ff9900}
.buy.flipkart{background:#2874f0}
.loading{text-align:center;padding:40px;color:#777;grid-column:1/-1}
.footer{text-align:center;padding:20px;color:#888;font-size:12px}
</style>
</head>
<body>

<div class="header">
  <h1>🛍️ PriceLoot</h1>
  <p>Real Products • Real Photo • Real Price Compare</p>
</div>

<div class="search-box">
  <input id="q" placeholder="Search iPhone, Saree, Drone, Lipstick..." onkeyup="if(event.key==='Enter') load()">
  <button onclick="load()">Search</button>
</div>

<div class="cats" id="cats">
  <button class="active" onclick="setCat('ALL',this)">All</button>
  <button onclick="setCat('Mobile',this)">📱 Mobile</button>
  <button onclick="setCat('Earbuds',this)">🎧 Earbuds</button>
  <button onclick="setCat('Watch',this)">⌚ Watch</button>
  <button onclick="setCat('Headphones',this)">🎧 Headphones</button>
  <button onclick="setCat('Fridge',this)">❄️ Fridge</button>
  <button onclick="setCat('Air Cooler',this)">💨 Air Cooler</button>
  <button onclick="setCat('Fashion Men',this)">👔 Fashion Men</button>
  <button onclick="setCat('Fashion Women',this)">👗 Fashion Women</button>
  <button onclick="setCat('Jewellery',this)">💍 Jewellery</button>
  <button onclick="setCat('Toys',this)">🧸 Toys</button>
  <button onclick="setCat('Makeup',this)">💄 Makeup</button>
  <button onclick="setCat('Skin Care',this)">✨ Skin Care</button>
</div>

<div class="count" id="count">Loading products...</div>
<div class="grid" id="grid"><div class="loading">Loading real products...</div></div>
<div class="footer">PriceLoot • Prices are reference, live price on Amazon/Flipkart • Made in India 🇮🇳</div>

<script>
const API_BASE = "https://champloot-server.onrender.com";
let currentCat = 'ALL';

function setCat(cat, btn){
  currentCat = cat;
  document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  load();
}

async function load(){
  let q = document.getElementById('q').value;
  let grid = document.getElementById('grid');
  grid.innerHTML = '<div class="loading">Loading...</div>';
  try{
    let res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}&cat=${encodeURIComponent(currentCat)}`);
    let data = await res.json();
    document.getElementById('count').innerText = `Showing ${data.length} real products • Category: ${currentCat}`;
    if(data.length===0){ grid.innerHTML='<div class="loading">No product found. Try another search.</div>'; return; }
    grid.innerHTML = data.map(p=>{
      // Find cheapest store = Best Price
      let best = p.stores.reduce((a,b)=> a.price < b.price ? a : b);
      let storesHtml = p.stores.map(s=>`
        <div class="store-row">
          <span>${s.name} <span class="off">${s.discount}% off</span></span>
          <b>₹${s.price.toLocaleString('en-IN')}</b>
        </div>
        <a class="buy ${s.name.toLowerCase()}" href="${s.link}" target="_blank">Buy on ${s.name} ↗</a>
      `).join('');
      return `
      <div class="card">
        <img src="${p.image}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'" loading="lazy" alt="${p.name}">
        <div class="card-body">
          <span class="cat-tag">${p.category}</span>
          <h3>${p.name}</h3>
          <div class="best">Best Price: <b>₹${best.price.toLocaleString('en-IN')}</b> on ${best.name}</div>
          <div class="store">${storesHtml}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    grid.innerHTML = '<div class="loading">Server is waking up... Wait 30 sec and refresh. (Render free server sleeps)</div>';
  }
}
load();
</script>
</body>
</html>
